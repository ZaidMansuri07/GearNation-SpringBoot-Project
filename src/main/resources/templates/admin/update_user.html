<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Member | GearNation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-fade-in" style="background-color: #0b0b0b;">
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="container" style="display: flex; justify-content: center; padding: 100px 0;">
        <div class="glass-card" style="width: 100%; max-width: 450px; background: rgba(20,20,20,0.8); padding: 30px; border: 1px solid #333;">
            <h2 class="gradient-text" style="text-align: center;">Update Member</h2>
            <form th:action="@{/admin/updateUser/{id}(id=${user.registerId})}" th:object="${user}" method="post" style="margin-top: 25px;">
                <label style="color: #888;">User Name</label>
                <input type="text" th:field="*{userName}" required style="width: 100%; background: #222; color: white; border: 1px solid #444; padding: 10px; margin-bottom: 15px;">
                <label style="display: block; color: #888;">Email Address</label>
                <input type="email" th:field="*{email}" required style="width: 100%; background: #222; color: white; border: 1px solid #444; padding: 10px;">
                <button type="submit" class="btn-luxury" style="width: 100%; margin-top: 30px; border-radius: 0;">Apply Updates</button>
                <a th:href="@{/admin/showRecords}" style="display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none;">Discard Changes</a>
            </form>
        </div>
    </main>
</body>
</html>
