<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Member | CarNation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-fade-in">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container" style="display: flex; justify-content: center; padding: 100px 0;">
        <div class="glass-card" style="width: 100%; max-width: 450px;">
            <h2 class="gradient-text" style="text-align: center;">Update Member</h2>

            <form th:action="@{/updateUser/{id}(id=${user.registerId})}" th:object="${user}" method="post" style="margin-top: 25px;">
                
                <label>User Name</label>
                <input type="text" th:field="*{userName}" required>
                
                <label style="display: block; margin-top: 15px;">Email Address</label>
                <input type="email" th:field="*{email}" required>
                
                <button type="submit" class="btn-submit" style="width: 100%; margin-top: 30px;">Apply Updates</button>
                
                <a th:href="@{/showRecords}" style="display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none;">Discard Changes</a>
            </form>
        </div>
    </main>
</body>
</html>
