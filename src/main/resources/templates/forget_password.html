<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>GearNation | Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background-color: #0d0d0d; color: white; font-family: 'Poppins', sans-serif;">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="auth-card" style="background: #1a1a1a; padding: 40px; border-radius: 12px; border: 1px solid #0066b3; width: 400px;">
            
            <h2 class="gradient-text" style="text-align: center;">RESET PASSWORD</h2>
            <p style="text-align: center; color: #888; font-size: 0.8rem; margin-bottom: 30px;">Enter your registered email to set a new password.</p>

            <form th:action="@{/resetPassword}" method="post">
                <div style="margin-bottom: 20px;">
                    <label style="color: #0066b3; font-size: 0.75rem;">EMAIL ADDRESS</label>
                    <input type="email" name="email" style="width: 100%; padding: 12px; margin-top: 5px; background: #262626; color: white; border: 1px solid #333; border-radius: 4px;" required>
                </div>

                <div style="margin-bottom: 30px;">
                    <label style="color: #0066b3; font-size: 0.75rem;">NEW PASSWORD</label>
                    <input type="password" name="newPassword" style="width: 100%; padding: 12px; margin-top: 5px; background: #262626; color: white; border: 1px solid #333; border-radius: 4px;" required>
                </div>

                <button type="submit" style="width: 100%; padding: 15px; background: #0066b3; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px;">
                    RESET PASSWORD
                </button>
            </form>

            <p style="text-align: center; margin-top: 20px;">
                <a th:href="@{/login}" style="color: #666; text-decoration: none; font-size: 0.9rem;">BACK TO LOGIN</a>
            </p>
        </div>
    </main>

</body>
</html>
