<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Assistant | GearNation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .chat-container { max-width: 800px; margin: 120px auto; padding: 20px; }
        .chat-box { 
            height: 450px; overflow-y: auto; background: rgba(10, 10, 10, 0.9);
            border: 1px solid #333; padding: 20px; border-radius: 8px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .chat-input-area .btn-luxury {
    margin-bottom: 0;
    padding: 10px 25px;
    height: 48px; /* Matches the input height */
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    font-size: 0.9rem;
    letter-spacing: 1px;
}
        .bot-msg { background: #0066b3; color: white; padding: 10px 15px; border-radius: 15px 15px 15px 0; align-self: flex-start; max-width: 70%; }
        .user-msg { background: #222; color: #0066b3; border: 1px solid #0066b3; padding: 10px 15px; border-radius: 15px 15px 0 15px; align-self: flex-end; max-width: 70%; }
        .chat-input-area { display: flex; gap: 10px; margin-top: 20px; }
        .chat-input-area input { flex: 1; background: #111; border: 1px solid #333; color: white; padding: 12px; border-radius: 4px; outline: none; }
    </style>
</head>
<body class="page-fade-in" style="background: #0b0b0b;">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="chat-container">
        <h2 class="gradient-text">GEARNATION AI ASSISTANT</h2>
        <div class="chat-box" id="chatBox">
            <div class="bot-msg">Welcome to GearNation, How can I assist you today?</div>
        </div>

        <div class="chat-input-area" style="display: flex; gap: 10px; margin-top: 20px; align-items: center;">
    <input type="text" id="userInput" placeholder="Ask about BMW, Bugatti, or Profile settings..." 
           style="height: 48px; flex: 1; background: #111; border: 1px solid #333; color: white; padding: 0 15px; border-radius: 4px; outline: none;">
    
    <button onclick="sendMessage()" class="btn-luxury">SEND</button>
</div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:inline="javascript">
    const responses = {
    	    // Intro
    	    "hello": "Welcome to GearNation,I am here to assist you. Ask me about our Elite Eight cars, your profile, or system security.",
    	    "hey": "Greetings! Ready to explore the world's fastest machines? Type a brand name like 'Bugatti' to start.",
    	    
    	    // Car Keys
    	    "bmw": "BMW (Bayerische Motoren Werke) is the 'Ultimate Driving Machine'. Explore our M-Series collection featuring the M3, M4, and M5 Competition.",
    	    "bugatti": "Bugatti is the peak of automotive art. Our showcase includes the record-breaking Chiron Super Sport 300+ and the legendary Veyron.",
    	    "porsche": "Porsche: Engineering Perfection. Our 911 GT3 RS and Taycan Turbo S pages are highly recommended for performance enthusiasts.",
    	    "ferrari": "Ferrari Scuderia represents Italian passion. Check out the SF90 Stradale and the 812 Competizione in our Ferrari stable.",
    	    "mclaren": "McLaren Ultimate Series features the P1 and the Senna. Their carbon-fiber MonoCage technology is unmatched.",
    	    "audi": "Audi RS Series combines luxury with Quattro all-wheel-drive power. The RS6 Avant and R8 V10 are fan favorites.",
    	    "toyota": "Toyota Gazoo Racing (GR) features the iconic Supra MK4 and the new GR Yaris. Pure JDM heritage.",
    	    "aston martin": "Aston Martin: Elegance meets raw power. Explore the DB11 and the Valkyrie hypercar.",

    	    // Account based
    	    "profile": "To view your stats, go to 'My Garage' in the header. You can edit your username and email there.",
    	    "password": "Security first! You can update your access key in the 'Change Password' section of your profile.",
    	    "admin": "Admin access is restricted. Use the 'Authenticate' portal in the footer with the master key.",
    	    "database": "GearNation runs on a Spring Boot backend connected to a MySQL database named 'carnation'.",
    	    
    	    // Outro
    	    "help": "I can help you with: 1. Car Specifications 2. Account Management 3. System Status. What do you need?",
    	    "bye": "Engine off. Drive safe and we'll see you at the next starting line!",
    	    "thanks": "You're welcome! Anything else I can assist you with today?"
    	};

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const userText = inputField.value.toLowerCase().trim();

            if (userText === "") return;

            chatBox.innerHTML += `<div class="user-msg">${inputField.value}</div>`;
            
            let botReply = "I'm sorry, I don't have information on that. Please do 'Help'.";
            
            for (let key in responses) {
                if (userText.includes(key)) {
                    botReply = responses[key];
                    break;
                }
            }

            setTimeout(() => {
                chatBox.innerHTML += `<div class="bot-msg">${botReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);

            inputField.value = "";
        }
    </script>
</body>
</html>
