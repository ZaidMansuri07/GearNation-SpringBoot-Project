<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>GearNation | Chatbot</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .chat-container { width: 400px; margin: 50px auto; background: #1a1a1a; padding: 20px; border-radius: 10px; border: 1px solid #0066b3; }
        #chat-box { height: 300px; overflow-y: auto; color: white; margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #333; }
        .bot-msg { color: #0066b3; font-weight: bold; }
        .user-msg { color: #fff; }
        input { width: 75%; padding: 10px; background: #333; color: white; border: none; }
        button { width: 20%; padding: 10px; background: #0066b3; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2 style="color: white; text-align: center;">GEARNATION ChatBot</h2>
        <div id="chat-box"></div>
        <input type="text" id="user-input" placeholder="Ask about brands...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Chatbot Knowledge Base
        const responses = {
            "bmw": "BMW (Bayerische Motoren Werke) is known for the 'Ultimate Driving Machine'. We feature the M3, M4, and M5 models.",
            "bugatti": "Bugatti represents the pinnacle of speed. Have you seen our page on the Chiron and Veyron?",
            "porsche": "Porsche combines everyday usability with high-performance engineering, especially the 911 series.",
            "admin": "The admin can be reached at contact@gearnation.com for directory issues.",
            "database": "Your data is securely stored in our MySQL 'gearnation' database.",
            "hello": "Welcome to GearNation! Ask me about BMW, Bugatti, or Porsche.",
            "bye": "Drive safe! Come back to GearNation soon."
        };

        function sendMessage() {
            let inputField = document.getElementById("user-input");
            let chatBox = document.getElementById("chat-box");
            let userText = inputField.value.toLowerCase();

            if (userText.trim() === "") return;

            chatBox.innerHTML += `<p class="user-msg"><b>You:</b> ${inputField.value}</p>`;
            
            // Keyword Matching Logic
            let botResponse = "I am not sure about that. Try asking about BMW, Bugatti, or Porsche!";
            
            for (let key in responses) {
                if (userText.includes(key)) {
                    botResponse = responses[key];
                    break;
                }
            }

            setTimeout(() => {
                chatBox.innerHTML += `<p class="bot-msg"><b>Bot:</b> ${botResponse}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);

            inputField.value = "";
        }
    </script>
</body>
</html>
