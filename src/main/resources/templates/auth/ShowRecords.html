<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Directory | CarNation</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        .table-container { padding: 40px; color: white; background: #0b0b0b; min-height: 100vh; }

        .dataTables_filter input { 
            background: #222; 
            color: white; 
            border: 1px solid #0066b3; 
            border-radius: 5px; 
            padding: 5px 10px; 
            margin-left: 10px; 
        }
        .dataTables_length select { background: #222; color: white; border: 1px solid #333; }
        .dataTables_wrapper .dataTables_info, .dataTables_wrapper .dataTables_paginate { color: #ccc !important; }
        

        .table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(0, 0, 0, 0.6); }
        .table th, .table td { padding: 12px; border: 1px solid #333; text-align: left; }
        .table th { background-color: #111; color: #0066b3; cursor: pointer; }
        
        .btn-luxury {
            background: linear-gradient(45deg, #0066b3, #004a80);
            color: white; border: none; padding: 12px 25px; border-radius: 5px;
            cursor: pointer; font-weight: bold; margin-bottom: 20px; transition: 0.3s;
        }
        .btn-luxury:hover { opacity: 0.8; transform: translateY(-2px); }

        .swal2-container {
            z-index: 99999 !important;
            position: fixed !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
        .swal2-popup {
            border: 1px solid #0066b3 !important;
            box-shadow: 0 0 20px rgba(0, 102, 179, 0.3) !important;
        }
    </style>
</head>
<body class="page-fade-in">

    <div th:replace="~{fragments/header :: header}"></div>
    <br><br>
	
    <main class="table-container">
        <h2 class="gradient-text">Member Directory</h2>
        
        <button type="button" class="btn-luxury" onclick="welcome()">
            Check System Status
        </button>

<table id="example" class="table table-striped">
	<div style="margin-bottom: 10px; color: #888; font-size: 0.9rem;">
    TOTAL ACTIVE MEMBERS: <span th:text="${#lists.size(users)}" style="color: #0066b3; font-weight: bold;">0</span>
</div>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th style="text-align: center;">Actions</th> </tr>
    </thead>
    <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.registerId}">ID</td>
            <td th:text="${user.userName}">Name</td>
            <td th:text="${user.email}">Email</td>
            <td style="text-align: center;">
                <a th:href="@{/editUser/{id}(id=${user.registerId})}" 
                   class="btn-luxury" 
                   style="padding: 5px 12px; font-size: 0.8rem; text-decoration: none; margin-right: 5px;">
                   Edit
                </a>
                
                <button class="btn-luxury" 
                        style="padding: 5px 12px; font-size: 0.8rem; background: linear-gradient(45deg, #e3000b, #990000);" 
                        th:onclick="'confirmDelete(' + ${user.registerId} + ')'">
                    Delete
                </button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="4" style="text-align: center;">No active registrations found.</td>
        </tr>
    </tbody>
</table>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#example').DataTable({
                "paging": true,
                "searching": true,
                "ordering": true,
                "info": true,
                "language": {
                    "search": "FILTER LOGS:",
                    "searchPlaceholder": "Search by name..."
                }
            });
        });

        function welcome() {
            Swal.fire({
                title: 'Access Verified',
                text: 'System records are currently synchronized with the database.',
                icon: 'success',
                background: '#1a1a1a',
                color: '#fff',
                confirmButtonColor: '#0066b3',
                confirmButtonText: 'Confirm',
                heightAuto: false, // Critical to stop vertical offset
                position: 'center'
            });
        }
        
        function confirmDelete(id) {
            Swal.fire({
                title: 'Remove Member?',
                text: "This action will permanently delete the member from the database.",
                icon: 'warning',
                showCancelButton: true,
                background: '#1a1a1a',
                color: '#fff',
                confirmButtonColor: '#e3000b',
                cancelButtonColor: '#444',
                confirmButtonText: 'Yes, Delete',
                heightAuto: false, 
                position: 'center'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = "/deleteUser/" + id;
                }
            });
        }
        
        $(document).ready(function() {
            var msg = "[[${message}]]"; 
            
            if (msg && msg !== "") {
                Swal.fire({
                    title: 'Success!',
                    text: msg,
                    icon: 'success',
                    background: '#1a1a1a',
                    color: '#fff',
                    confirmButtonColor: '#0066b3',
                    heightAuto: false,
                    position: 'center'
                });
            }
        });
    </script>
</body>
</html>
