<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Driver Profile | GearNation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-fade-in" style="background-color: #0b0b0b; color: white;">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container" style="padding: 120px 20px; display: flex; justify-content: center; min-height: 80vh;">
        <div class="glass-card" style="width: 100%; max-width: 600px; border-left: 4px solid #0066b3; padding: 40px; background: rgba(17, 17, 17, 0.9);">
            <h2 class="gradient-text" style="letter-spacing: 2px;">DRIVER PROFILE</h2>
            
            <div style="margin: 30px 0; border-top: 1px solid #222; padding-top: 20px;">
                <p style="color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;">Account Holder</p>
                <h3 style="color: #fff; margin-bottom: 25px; font-size: 1.5rem;" th:text="${user.userName}">Username</h3>
                
                <p style="color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;">Registered Email</p>
                <p style="color: #0066b3; font-weight: bold; font-size: 1.1rem;" th:text="${user.email}">email@example.com</p>
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 40px;">
                <a th:href="@{/editProfile}" class="btn-luxury" style="text-decoration: none; padding: 12px 25px;">EDIT DETAILS</a>
                <a th:href="@{/changePassword}" class="btn-luxury" style="background: #222; text-decoration: none; padding: 12px 25px;">SECURITY SETTINGS</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
