<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Driver Profile | GearNation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-fade-in" style="background-color: #0b0b0b;">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container" style="display: flex; justify-content: center; padding: 100px 0;">
        <div class="glass-card" style="width: 100%; max-width: 450px; background: rgba(20,20,20,0.8); padding: 30px; border: 1px solid #333; border-radius: 10px;">
            <h2 class="gradient-text" style="text-align: center; letter-spacing: 2px;">EDIT PROFILE</h2>
            
            <form th:action="@{/updateProfile}" th:object="${user}" method="post" style="margin-top: 25px;">
                <label style="color: #888; font-size: 0.8rem; text-transform: uppercase;">Username</label>
                <input type="text" th:field="*{userName}" required 
                       style="width: 100%; background: #111; color: white; border: 1px solid #333; padding: 12px; margin-bottom: 20px; outline: none; border-radius: 4px;">
                
                <label style="display: block; color: #888; font-size: 0.8rem; text-transform: uppercase;">Email Address</label>
                <input type="email" th:field="*{email}" required 
                       style="width: 100%; background: #111; color: white; border: 1px solid #333; padding: 12px; outline: none; border-radius: 4px;">
                
                <button type="submit" class="btn-luxury" style="width: 100%; margin-top: 35px; letter-spacing: 1px;">
                    SAVE CHANGES
                </button>
                
                <a th:href="@{/profile}" style="display: block; text-align: center; margin-top: 15px; color: #555; text-decoration: none; font-size: 0.9rem;">Discard Changes</a>
            </form>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
