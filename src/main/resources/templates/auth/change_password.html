<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Security Settings | GearNation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-fade-in" style="background-color: #0b0b0b; color: white;">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container" style="padding: 120px 20px; display: flex; justify-content: center; min-height: 80vh;">
        <div class="glass-card" style="width: 100%; max-width: 450px; background: rgba(17, 17, 17, 0.9); padding: 40px; border: 1px solid #333; border-radius: 10px;">
            <h2 class="gradient-text" style="text-align: center; letter-spacing: 2px;">CHANGE PASSWORD</h2>
            
            <form th:action="@{/updatePassword}" method="post" style="margin-top: 30px;">
                <label style="color: #888; font-size: 0.8rem; text-transform: uppercase; display: block; margin-bottom: 8px;">Current Password</label>
                <input type="password" name="oldPassword" required 
                       style="width: 100%; background: #111; color: white; border: 1px solid #333; padding: 12px; margin-bottom: 20px; outline: none; border-radius: 4px;">
                
                <label style="color: #888; font-size: 0.8rem; text-transform: uppercase; display: block; margin-bottom: 8px;">New Password</label>
                <input type="password" name="newPassword" required 
                       style="width: 100%; background: #111; color: white; border: 1px solid #333; padding: 12px; outline: none; border-radius: 4px;">
                
                <button type="submit" class="btn-luxury" style="width: 100%; margin-top: 35px; letter-spacing: 1px; font-weight: bold;">
                    UPDATE SECURITY KEY
                </button>
                
                <a th:href="@{/profile}" style="display: block; text-align: center; margin-top: 20px; color: #555; text-decoration: none; font-size: 0.9rem;">Back to Profile</a>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
